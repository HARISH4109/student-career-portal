name: Security Gate

on:
  pull_request:
    branches: [main, develop]

permissions:
  contents: read
  security-events: write

jobs:
  dependency-audit:
    name: SCA Dependency Audit (Node & Python)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install Node dependencies
        run: npm ci

      - name: Audit Node production dependencies
        run: npm audit --omit=dev --audit-level=critical

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Audit Python AI service dependencies
        run: |
          python -m pip install --upgrade pip pip-audit
          pip-audit -r apps/ai-service/requirements.txt

  strix-pr-scan:
    name: Strix Diff-Scoped Security Scan
    runs-on: ubuntu-latest
    if: ${{ vars.ENABLE_STRIX_CI == 'true' }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Strix
        run: curl -sSL https://strix.ai/install | bash

      - name: Run diff-scoped Strix security scan
        env:
          STRIX_LLM: ${{ secrets.STRIX_LLM }}
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
        run: |
          strix -n -t ./ --scan-mode quick --scope-mode diff --diff-base "origin/${{ github.base_ref }}" --max-budget 15 --fail-on high

      - name: Fail closed unless Strix scan completed
        if: always()
        run: |
          run_json=$(ls -t strix_runs/*/run.json | head -1)
          status=$(jq -r .status "$run_json")
          if [ "$status" != "completed" ]; then
            echo "Strix run status is '$status' — scan did not complete. Increase --max-budget." >&2
            exit 1
          fi

      - name: Upload SARIF to GitHub Code Scanning
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: strix_runs
